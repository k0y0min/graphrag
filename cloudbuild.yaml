steps:
  # 1. Pull previous image for cache
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        docker pull europe-west4-docker.pkg.dev/$PROJECT_ID/graphrag/app:latest || true

  # 2. Build Monolithic App Image (Backend + Embedded Frontend Static)
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        mkdir -p backend/frontend
        cp -r frontend/static backend/frontend/
        docker build \
          -t europe-west4-docker.pkg.dev/$PROJECT_ID/graphrag/app:$COMMIT_SHA \
          -t europe-west4-docker.pkg.dev/$PROJECT_ID/graphrag/app:latest \
          --cache-from europe-west4-docker.pkg.dev/$PROJECT_ID/graphrag/app:latest \
          ./backend

  # 3. Push Image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'europe-west4-docker.pkg.dev/$PROJECT_ID/graphrag/app', '--all-tags']

  # 4. Ensure DB Cloud Storage bucket exists
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud storage buckets describe gs://graphrag-db-$PROJECT_ID || gcloud storage buckets create gs://graphrag-db-$PROJECT_ID --location=europe-west4

  # 5. Deploy Unified Monolithic Service to Cloud Run (Standard CPU, $0 GPU cost)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud beta run deploy graphrag \
          --image europe-west4-docker.pkg.dev/$PROJECT_ID/graphrag/app:$COMMIT_SHA \
          --region europe-west4 \
          --cpu 1 \
          --memory 1Gi \
          --allow-unauthenticated \
          --no-cpu-throttling \
          --execution-environment=gen2 \
          --add-volume=name=db-volume,type=cloud-storage,bucket=graphrag-db-$PROJECT_ID \
          --add-volume-mount=volume=db-volume,mount-path=/app/db \
          --set-env-vars="USE_VLLM=false,GEMINI_MODEL=vertex_ai/gemini-3.8-flash,VERTEX_LOCATION=europe-west4,DB_PATH=/app/db/demo_db,CLEAR_DB_ON_STARTUP=false,FRONTEND_PATH=/app/frontend/static" \
          --port 8080

images:
  - 'europe-west4-docker.pkg.dev/$PROJECT_ID/graphrag/app:$COMMIT_SHA'
  - 'europe-west4-docker.pkg.dev/$PROJECT_ID/graphrag/app:latest'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
