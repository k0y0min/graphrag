steps:
  # 1. Pull previous images for caching
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        docker pull ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/graphrag-backend:latest || exit 0
        docker pull ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/graphrag-frontend:latest || exit 0
    id: 'pull-images'

  # 2. Build Backend Image (with caching)
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build', 
      '-t', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/graphrag-backend:latest',
      '-t', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/graphrag-backend:$SHORT_SHA',
      '--cache-from', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/graphrag-backend:latest',
      './backend'
    ]
    id: 'build-backend'
    waitFor: ['pull-images']

  # 3. Build & Run Tests (using the built image with debug info)
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        echo "Listing files in image:"
        docker run ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/graphrag-backend:$SHORT_SHA ls -R /app
        echo "Running pytest:"
        docker run ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/graphrag-backend:$SHORT_SHA pytest tests/test_api.py
    id: 'run-tests'
    waitFor: ['build-backend']

  # 4. Build Frontend Image (with caching)
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build', 
      '-t', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/graphrag-frontend:latest',
      '-t', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/graphrag-frontend:$SHORT_SHA',
      '--cache-from', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/graphrag-frontend:latest',
      './frontend'
    ]
    id: 'build-frontend'
    waitFor: ['pull-images']

  # 5. Push images
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/graphrag-backend:latest']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/graphrag-backend:$SHORT_SHA']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/graphrag-frontend:latest']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/graphrag-frontend:$SHORT_SHA']
    id: 'push-images'
    waitFor: ['run-tests', 'build-frontend']

  # 6. Deploy Backend
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'graphrag-backend'
      - '--image'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/graphrag-backend:$SHORT_SHA'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '4Gi'
      - '--cpu'
      - '2'
    id: 'deploy-backend'
    waitFor: ['push-images']

  # 7. Deploy Frontend
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        BACKEND_URL=$(gcloud run services describe graphrag-backend --region ${_REGION} --format 'value(status.url)')
        gcloud run deploy graphrag-frontend \
          --image ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/graphrag-frontend:$SHORT_SHA \
          --region ${_REGION} \
          --platform managed \
          --allow-unauthenticated \
          --set-env-vars BACKEND_URL=$$BACKEND_URL
    id: 'deploy-frontend'
    waitFor: ['deploy-backend']

images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/graphrag-backend:latest'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/graphrag-backend:$SHORT_SHA'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/graphrag-frontend:latest'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/graphrag-frontend:$SHORT_SHA'

substitutions:
  _REGION: us-central1
  _REPO: graphrag-repo # Replace this with your actual Artifact Registry repository name

options:
  logging: CLOUD_LOGGING_ONLY
