steps:
  # -1. Pull previous latest images for layer caching to accelerate builds
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        docker pull ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/vllm-service:latest || true
        docker pull ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/graphrag-backend:latest || true
        docker pull ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/graphrag-frontend:latest || true
    id: 'pull-caches'

  # 0. Build vLLM Image
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    secretEnv: ['HF_TOKEN']
    args:
      - '-c'
      - |
        docker build \
          --cache-from ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/vllm-service:latest \
          -t ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/vllm-service:latest \
          -t ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/vllm-service:$BUILD_ID \
          --build-arg HF_TOKEN=$$HF_TOKEN \
          ./vllm
    id: 'build-vllm'

  # 1. Build Backend Image (passing HF_TOKEN as build-arg)
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    secretEnv: ['HF_TOKEN']
    args:
      - '-c'
      - |
        docker build \
          --cache-from ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/graphrag-backend:latest \
          -t ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/graphrag-backend:latest \
          -t ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/graphrag-backend:$BUILD_ID \
          --build-arg HF_TOKEN=$$HF_TOKEN \
          ./backend
    id: 'build-backend'

  # 2. Run Tests
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        docker run \
          ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/graphrag-backend:$BUILD_ID \
          pytest tests/test_api.py
    id: 'run-tests'
    waitFor: ['build-backend']

  # 3. Build Frontend Image
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build', 
      '--cache-from', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/graphrag-frontend:latest',
      '-t', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/graphrag-frontend:latest',
      '-t', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/graphrag-frontend:$BUILD_ID',
      './frontend'
    ]
    id: 'build-frontend'

  # 4. Push vLLM Image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/vllm-service:latest']
    id: 'push-vllm-latest'
    waitFor: ['build-vllm']
    
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/vllm-service:$BUILD_ID']
    id: 'push-vllm'
    waitFor: ['push-vllm-latest']

  # 5. Push Backend Image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/graphrag-backend:latest']
    id: 'push-backend-latest'
    waitFor: ['run-tests']
    
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/graphrag-backend:$BUILD_ID']
    id: 'push-backend'
    waitFor: ['push-backend-latest']

  # 6. Push Frontend Image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/graphrag-frontend:latest']
    id: 'push-frontend-latest'
    waitFor: ['build-frontend']
    
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/graphrag-frontend:$BUILD_ID']
    id: 'push-frontend'
    waitFor: ['push-frontend-latest']

  # 4.5. Deploy vLLM Service (Requires GPUs)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:latest'
    entrypoint: 'bash'
    secretEnv: ['HF_TOKEN']
    args:
      - '-c'
      - |
        gcloud run deploy vllm-service \
          --image ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/vllm-service:$BUILD_ID \
          --region ${_REGION} \
          --platform managed \
          --allow-unauthenticated \
          --memory 32Gi \
          --cpu 8 \
          --gpu 1 \
          --gpu-type nvidia-l4 \
          --no-cpu-throttling \
          --no-gpu-zonal-redundancy \
          --max-instances 1 \
          --execution-environment gen2 \
          --port 8000 \
          --set-secrets HUGGING_FACE_HUB_TOKEN=HF_TOKEN:latest \
          --args="--model,unsloth/gemma-3-12b-it-FP8-Dynamic,--port,8000,--host,0.0.0.0,--trust-remote-code,--max-model-len,4096"
    id: 'deploy-vllm'
    waitFor: ['push-vllm']

  # 8. Deploy Backend
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        VLLM_URL=$(gcloud run services describe vllm-service --region ${_REGION} --format 'value(status.url)')
        gcloud run deploy graphrag-backend \
          --image ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/graphrag-backend:$BUILD_ID \
          --region ${_REGION} \
          --platform managed \
          --allow-unauthenticated \
          --memory 4Gi \
          --cpu 2 \
          --set-env-vars VLLM_BASE_URL=$$VLLM_URL/v1,VLLM_MODEL_NAME=unsloth/gemma-3-12b-it-FP8-Dynamic,CLEAR_DB_ON_STARTUP=false
    id: 'deploy-backend'
    waitFor: ['deploy-vllm', 'push-backend']

  # 9. Deploy Frontend
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        BACKEND_URL=$(gcloud run services describe graphrag-backend --region ${_REGION} --format 'value(status.url)')
        gcloud run deploy graphrag-frontend \
          --image ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/graphrag-frontend:$BUILD_ID \
          --region ${_REGION} \
          --platform managed \
          --allow-unauthenticated \
          --set-env-vars BACKEND_URL=$$BACKEND_URL
    id: 'deploy-frontend'
    waitFor: ['deploy-backend', 'push-frontend']

images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/vllm-service:latest'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/vllm-service:$BUILD_ID'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/graphrag-backend:latest'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/graphrag-backend:$BUILD_ID'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/graphrag-frontend:latest'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/graphrag-frontend:$BUILD_ID'

substitutions:
  _REGION: europe-west1
  _REPO: graphrag-repo

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/HF_TOKEN/versions/latest
      env: 'HF_TOKEN'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

timeout: 7200s
