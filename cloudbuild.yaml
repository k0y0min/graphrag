steps:
  # 1. Build Backend Image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'europe-west4-docker.pkg.dev/$PROJECT_ID/graphrag/backend:$COMMIT_SHA', './backend']

  # 2. Build vLLM Image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'europe-west4-docker.pkg.dev/$PROJECT_ID/graphrag/vllm:$COMMIT_SHA', './vllm']

  # 3. Push Backend Image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'europe-west4-docker.pkg.dev/$PROJECT_ID/graphrag/backend:$COMMIT_SHA']

  # 4. Push vLLM Image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'europe-west4-docker.pkg.dev/$PROJECT_ID/graphrag/vllm:$COMMIT_SHA']

  # 5. Deploy vLLM Service (GPU)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud beta run deploy graphrag-vllm \
          --image europe-west4-docker.pkg.dev/$PROJECT_ID/graphrag/vllm:$COMMIT_SHA \
          --region europe-west4 \
          --cpu 8 \
          --memory 32Gi \
          --gpu 1 \
          --gpu-type nvidia-l4 \
          --no-cpu-throttling \
          --max-instances 1 \
          --allow-unauthenticated \
          --set-secrets="HF_TOKEN=HF_TOKEN:latest" \
          --port 8000

  # 6. Deploy Backend Service
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        # Dynamically fetch the URL of the deployed vLLM service
        VLLM_URL=$$(gcloud run services describe graphrag-vllm --region europe-west4 --format 'value(status.url)')
        
        gcloud run deploy graphrag-backend \
          --image europe-west4-docker.pkg.dev/$PROJECT_ID/graphrag/backend:$COMMIT_SHA \
          --region europe-west4 \
          --cpu 1 \
          --memory 1Gi \
          --allow-unauthenticated \
          --set-env-vars="VLLM_BASE_URL=$$VLLM_URL/v1,USE_GEMINI=true,GEMINI_MODEL=gemini/gemini-3-flash-preview" \
          --set-secrets="GOOGLE_API_KEY=GOOGLE_API_KEY:latest" \
          --port 8080

images:
  - 'europe-west4-docker.pkg.dev/$PROJECT_ID/graphrag/backend:$COMMIT_SHA'
  - 'europe-west4-docker.pkg.dev/$PROJECT_ID/graphrag/vllm:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY
