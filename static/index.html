<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GraphRAG Dashboard</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">

    <!-- Vis.js for Graph -->
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="static/css/style.css">

    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
    <div class="app-container">
        <!-- Sidebar: Controls & Chat -->
        <aside class="sidebar glass-panel">
            <div class="brand">
                <i data-lucide="network"></i>
                <h1>GraphRAG</h1>
            </div>

            <div class="tabs">
                <button class="tab-btn active" data-tab="ingest">Ingest</button>
                <button class="tab-btn" data-tab="query">Query</button>
            </div>

            <div class="tab-content" id="ingest-tab">
                <h3>Add Knowledge</h3>
                <p class="subtitle">Paste text to build the graph.</p>
                <textarea id="ingest-text" placeholder="SpaceX launched Starship in 2024..."></textarea>
                <div class="actions">
                    <button id="clear-db-btn" class="secondary-btn">
                        <i data-lucide="trash-2"></i> Clear DB
                    </button>
                    <button id="ingest-btn" class="primary-btn">
                        <i data-lucide="upload-cloud"></i> Ingest
                    </button>
                </div>
                <div id="progress-container" class="progress-container hidden">
                    <div class="progress-bar"></div>
                </div>
                <div id="ingest-status" class="status-msg"></div>
            </div>

            <div class="tab-content hidden" id="query-tab">
                <h3>Ask Graph</h3>
                <p class="subtitle">Query entities and relationships.</p>
                <div class="search-box">
                    <i data-lucide="search"></i>
                    <input type="text" id="query-input" placeholder="e.g. Elon Musk">
                </div>
                <button id="query-btn" class="primary-btn">Run Query</button>

                <div id="query-results" class="results-area">
                    <!-- Results will appear here -->
                    <div class="empty-state">Results will appear here...</div>
                </div>
            </div>


        </aside>

        <!-- Main: Graph Visualization -->
        <main class="main-content">
            <div id="network-container" class="glass-panel"></div>
            <div class="graph-controls">
                <button class="icon-btn" id="fit-btn" title="Fit Graph"><i data-lucide="maximize"></i></button>
            </div>
        </main>
    </div>

    <script src="static/js/app.js?v=3"></script>
    <script>
        lucide.createIcons();
    </script>
</body>

</html>
