version: '3.8'

services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
      - ./demo_db:/app/demo_db
      - ./logs:/app/logs
      - ./models:/app/models
    env_file:
      - .env
    environment:
      - PORT=8000
      - CLEAR_DB_ON_STARTUP=true
      - GEMINI_RPM_LIMIT=1000
    restart: always
