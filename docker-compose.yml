version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend/db:/app/db
      - ./backend/logs:/app/logs
      #- ./backend/models:/app/models
    env_file:
      - ./backend/.env
    environment:
      - PORT=8000
      - DB_PATH=db/demo_db
      - CLEAR_DB_ON_STARTUP=true
      - GEMINI_RPM_LIMIT=1000
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always
