version: '3.8'

services:
  graphrag:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - graphrag_db:/app/db
      - ./backend/logs:/app/logs
      - ./frontend/static:/app/frontend/static:ro
      - ./backend/api.py:/app/api.py
      - ./backend/src:/app/src
      - ${HOME:-/home/ayush}/.config/gcloud:/root/.config/gcloud:ro
    env_file:
      - ./backend/.env
    environment:
      - PORT=8080
      - DB_PATH=db/demo_db
      - GEMINI_MODEL=vertex_ai/gemini-3.8-flash
      - VERTEX_LOCATION=europe-west4
      - FRONTEND_PATH=/app/frontend/static
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    restart: unless-stopped

volumes:
  graphrag_db:
